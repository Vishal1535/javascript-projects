<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormValidation</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <div class="FormContainer">
            <h1>Singup</h1>
            <form action="#">
                <div class="NameContainer">
                    <label for="Name">Full Name</label>
                <input type="text" name="Name" id="Name" placeholder="type Name Here">
                 <i class="fa-solid" id="NameIcon"></i>
                <span id="NameDesc"></span>
                </div>
                <div class="EmailContainer">
                    <label for="Email">Email</label>
                    <i id="EmailIcon"></i>
                <input type="email" name="Email" id="Email" placeholder="xyz@gmail.com">
                <span id="EmailDesc"></span>
                </div>
                <div class="PassWordContainer">
                    <label for="Password">Password</label>
                     <i id="PasswordIcon"></i>
                <input type="password" name="Password" id="Password" placeholder="At least 8 Character">
                <span id="passwordDesc"></span>
                
            </div>
            <button id="SubmitBtn">Create Account</button>
            </form>
        </div>
    </div>
    
</body>
</html>
